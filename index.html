<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROOHI | Premium Abayas</title>
<meta name="description" content="ROOHI – premium abayas. Pay by card or cash on delivery. عبايات روحي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15100c; --ink-2:#1e1711;
  --sand:#ece3d3; --sand-2:#e0d3bd;
  --gold:#b6925a; --gold-soft:#d3b98a; --gold-deep:#8d6d3a;
  --taupe:#6f5d49;
  --text-on-sand:#231b13; --text-on-ink:#eadfcc; --muted-on-ink:#a89a86;
  --field-bg:rgba(255,255,255,.5); --line:rgba(111,93,73,.4); --err:#a3372c;
  --serif:"Italiana","Cormorant Garamond","Didot","Bodoni MT",Georgia,serif;
  --sans:"Tenor Sans","Gill Sans","Helvetica Neue",Arial,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:76px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sand:#1b1510;--sand-2:#241c15;--text-on-sand:#eadfcc;--taupe:#b3a591;--field-bg:rgba(255,255,255,.06);--line:rgba(211,185,138,.35);--err:#e5877b}
}
:root[data-theme="dark"]{--sand:#1b1510;--sand-2:#241c15;--text-on-sand:#eadfcc;--taupe:#b3a591;--field-bg:rgba(255,255,255,.06);--line:rgba(211,185,138,.35);--err:#e5877b}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--text-on-ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1280px,100% - 56px);margin-inline:auto}
.narrow{width:min(820px,100% - 48px);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(21,16,12,.97);border-bottom:1px solid rgba(182,146,90,.4)}
.nav .wrap{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:#f6efe2;line-height:1}
.brand .w{font-family:var(--serif);font-size:38px;letter-spacing:.08em;color:#f6efe2}
.brand .s{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:9.5px;letter-spacing:.34em;color:var(--gold-soft)}
.brand .s::before{content:"";width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}
.menu{display:flex;gap:40px;list-style:none;margin:0;padding:0;font-size:15px;letter-spacing:.08em}
.menu a{text-decoration:none;color:#cfc2ad;padding:8px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.menu a:hover,.menu a[aria-current="page"]{color:#f6efe2;border-color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:22px}
.nav .ar{font-family:var(--arabic);font-size:22px;color:var(--gold-soft);line-height:1}
.cart-link{position:relative;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;letter-spacing:.08em;color:#f6efe2;padding:8px 0}
.cart-link svg{width:24px;height:24px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:12px;line-height:20px;text-align:center}
.burger{all:unset;display:none;cursor:pointer;width:44px;height:44px;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:24px;height:1.5px;background:#f6efe2;position:relative;content:""}
.burger span::before{position:absolute;top:-7px}.burger span::after{position:absolute;top:7px}
.burger:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{flex:1;padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
main:focus{outline:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--sans);font-size:14px;letter-spacing:.16em;text-decoration:none;padding:17px 34px;border:1px solid var(--gold);color:var(--text-on-ink);background:transparent;cursor:pointer;transition:background .3s,color .3s,border-color .3s;text-align:center}
.on-sand .btn{color:var(--text-on-sand);border-color:var(--gold-deep)}
.btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;color:inherit}

/* ---------- Home hero ---------- */
.hero{--hero-pos:50% 30%;position:relative;isolation:isolate;display:flex;align-items:center;min-height:calc(100svh - var(--nav-h));overflow:hidden;background:linear-gradient(100deg,#1c050c 0%,#33091a 55%,#4a1224 100%);color:#f6efe2}
.hero-media{position:absolute;inset:0 0 0 auto;width:68%;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--hero-pos)}
.hero-copy{width:min(1280px,100% - 56px);margin-inline:auto;padding:clamp(56px,9vh,110px) 0}
.hero-copy > *{max-width:30rem}
.hero-sub{font-size:12px;letter-spacing:.34em;color:var(--gold-soft);margin:0 0 22px}
.hero-title{font-size:clamp(58px,7.6vw,118px);line-height:.98;letter-spacing:.005em;color:#f6efe2}
.hero-line{font-size:clamp(16px,1.25vw,19px);line-height:1.7;color:#eadfcc;margin:28px 0 38px;max-width:24rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.hero .btn{border-color:rgba(246,239,226,.7);color:#f6efe2;font-size:12.5px;padding:15px 30px}
.hero .btn:hover{background:#f6efe2;color:var(--ink);border-color:#f6efe2}
.scroll-cue{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;right:clamp(20px,3.5vw,56px);bottom:clamp(28px,6vh,64px);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:11px;letter-spacing:.2em;color:#eadfcc}
.scroll-cue i{display:block;position:relative;width:1px;height:84px;background:rgba(246,239,226,.55)}
.scroll-cue i::after{content:"";position:absolute;left:-4px;bottom:-9px;width:9px;height:9px;border:1px solid rgba(246,239,226,.8);border-radius:50%}
.scroll-cue:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
@media (prefers-reduced-motion:no-preference){
  .hero-media img{opacity:0;transform:scale(1.05);animation:heroin 1.6s .1s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes heroin{to{opacity:1;transform:none}}
}

/* ---------- Collections hero (full-width banner, photo fades in left-to-right) ---------- */
.coll-hero{position:relative;isolation:isolate;width:100%;aspect-ratio:21/9;min-height:340px;max-height:640px;overflow:hidden;background:linear-gradient(100deg,#1c050c 0%,#290813 45%,#33091a 100%)}
.coll-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:saturate(.85) brightness(1.05) contrast(.94);-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 30%,#000 62%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 30%,#000 62%)}
.coll-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,5,12,.55) 0%,rgba(28,5,12,.22) 40%,rgba(28,5,12,0) 62%)}
.coll-hero-copy{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;width:min(1280px,100% - 56px);margin-inline:auto;color:#f6efe2}
.coll-hero-copy .hero-sub{margin-bottom:16px}
.coll-hero-copy h1{font-size:clamp(40px,6vw,84px);line-height:1;max-width:16ch}
.coll-hero-copy p{font-style:italic;font-size:clamp(15px,1.3vw,18px);color:#eadfcc;margin:20px 0 0;max-width:32ch;line-height:1.6}
.coll-hero-copy .div-line{display:block;width:48px;height:1px;background:rgba(246,239,226,.55);margin-top:28px}
@media (max-width:820px){
  .coll-hero{aspect-ratio:4/5;max-height:520px;background:#1c050c}
  .coll-hero img{-webkit-mask-image:none;mask-image:none}
  .coll-hero::after{background:linear-gradient(0deg,rgba(28,5,12,.85) 0%,rgba(28,5,12,.45) 40%,rgba(28,5,12,.15) 75%)}
  .coll-hero-copy{width:min(1280px,100% - 40px);justify-content:flex-end;padding-bottom:36px}
  .coll-hero-copy h1{font-size:clamp(38px,11vw,58px)}
}

/* ---------- Sand pages ---------- */
.on-sand{background:var(--sand);color:var(--text-on-sand)}
.statement{padding:clamp(80px,12vw,170px) 0}
.statement p{font-family:var(--serif);font-size:clamp(34px,5.2vw,78px);line-height:1.12;margin:0;max-width:17ch}
.statement small{display:block;margin-top:40px;font-size:17px;line-height:1.8;max-width:46ch;color:var(--taupe)}
.trust{background:var(--sand-2);color:var(--text-on-sand);border-block:1px solid var(--line)}
.trust ul{list-style:none;margin:0;padding:26px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center;font-size:15px}
.trust strong{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--text-on-sand)}
.trust span{color:var(--taupe)}

.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:1px solid var(--line);padding-top:28px;margin-bottom:clamp(40px,6vw,80px)}
.sec-head h2{font-size:clamp(38px,5vw,68px);line-height:1}
.sec-head p{margin:0;color:var(--taupe);font-size:16px;max-width:32ch;text-align:right}
.section{padding:clamp(70px,10vw,140px) 0}
.page-head{padding:clamp(50px,7vw,90px) 0 clamp(30px,4vw,50px)}
.page-head h1{font-size:clamp(44px,6.5vw,92px);line-height:1}
.page-head p{margin:18px 0 0;color:var(--taupe);max-width:52ch}
.crumbs{font-size:14px;color:var(--taupe);margin-bottom:26px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs span{margin:0 8px}

/* product cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 26px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:block;text-decoration:none;color:inherit;position:relative}
.card .ph{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--sand-2)}
.card.oos .ph img{opacity:.5}
.tag-fs{position:absolute;top:14px;left:14px;z-index:2;background:rgba(246,239,226,.94);color:#231b13;font-size:12px;letter-spacing:.14em;padding:7px 13px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 clamp(30px,4vw,50px);padding:0 0 clamp(18px,2.4vw,26px);border-bottom:1px solid var(--line)}
.filters button{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 20px;font-size:15px;letter-spacing:.1em;color:var(--text-on-sand);border:1px solid var(--gold-deep);transition:color .25s,background .25s,border-color .25s}
.filters button:hover{background:rgba(182,146,90,.18)}
.filters button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#231b13}
.filters button[aria-pressed="true"] small{color:#231b13}
.filters button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.filters small{font-size:.85em;color:var(--taupe);margin-left:6px}

/* ---------- Collections page animations ---------- */
@media (prefers-reduced-motion:no-preference){
  .coll-hero img{animation:collZoom 2.2s cubic-bezier(.2,.7,.2,1) both}
  @keyframes collZoom{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
  .coll-hero-copy>*{opacity:0;animation:collRise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .coll-hero-copy>:nth-child(1){animation-delay:.25s}
  .coll-hero-copy>:nth-child(2){animation-delay:.4s}
  .coll-hero-copy>:nth-child(3){animation-delay:.6s}
  .coll-hero-copy>:nth-child(4){animation-delay:.8s}
  @keyframes collRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .coll-fade{opacity:0;animation:collRise .8s .9s cubic-bezier(.2,.7,.2,1) forwards}
  .card.rv{opacity:0;transform:translateY(38px) scale(.98)}
  .card.rv.in{opacity:1;transform:none;transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
  .card h3{transition:color .3s}
  .card:hover h3{color:var(--gold-deep)}
}
.filter-note{color:var(--taupe);margin:-14px 0 clamp(26px,3vw,40px);max-width:56ch}
.tag-oos{position:absolute;top:14px;left:14px;z-index:2;background:#15100c;color:#ece3d3;font-size:12px;letter-spacing:.14em;padding:7px 13px}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.04)}
.card .quick{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:center;background:rgba(51,9,26,.94);color:#fff;font-size:14px;letter-spacing:.16em;transform:translateY(100%);transition:transform .4s}
.card:hover .quick,.card:focus-visible .quick{transform:none}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding-top:18px}
.card h3{font-size:clamp(24px,2vw,30px);line-height:1.15}
.card .price{white-space:nowrap;font-size:16px}
.pbox{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
.pbox .was{font-size:.82em;color:var(--taupe);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.85;line-height:1.2}
.pbox .now{line-height:1.2}
.off{display:inline-block;font-size:11.5px;letter-spacing:.04em;line-height:1;padding:4px 8px;border:1px solid var(--gold-deep);color:var(--gold-deep);border-radius:3px;white-space:nowrap}
.pdp .pbox{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:14px 0 0}
.pdp .pbox .was{font-size:19px}
.pdp .pbox .now{font-size:26px}
.pdp .pbox .off{font-size:13px;padding:5px 10px}
.card p{margin:6px 0 0;font-size:15px;color:var(--taupe);line-height:1.55}
.card .stock,.pdp .stock{display:block;margin-top:8px;font-size:13.5px;letter-spacing:.06em;color:var(--gold-deep)}
.card .stock.oos,.pdp .stock.oos{color:var(--err)}
@media (hover:none){.card .quick{display:none}}

/* detail band */
.detail{position:relative;min-height:80vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--ink)}
.detail img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.detail::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(28,5,12,.92) 0%,rgba(28,5,12,.55) 32%,rgba(28,5,12,0) 62%)}
.detail .wrap{position:relative;z-index:2;padding-bottom:clamp(50px,7vw,100px)}
.detail h2{font-size:clamp(38px,5.6vw,84px);line-height:1.05;max-width:16ch;color:#f6efe2}
.detail p{margin:22px 0 0;max-width:44ch;color:var(--text-on-ink)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--gold-deep);padding-top:20px}
.steps li::before{content:counter(s);display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--gold-deep);margin-bottom:12px}
.steps h3{font-size:24px;margin-bottom:8px}
.steps p{margin:0;font-size:15.5px;color:var(--taupe);line-height:1.6}

/* ---------- Product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,80px);align-items:start;padding-bottom:clamp(60px,8vw,110px)}
.pdp-gallery{position:sticky;top:calc(var(--nav-h) + 24px)}
.pdp-img{aspect-ratio:3/4;overflow:hidden;background:var(--sand-2)}
.pdp-img.oos img{opacity:.55}
.pdp-img img{width:100%;height:100%;object-fit:cover}
/* face-hiding crop: each photo can be zoomed (via --cs) from its bottom edge so the top, where the face is, falls outside the frame */
.card img,.pdp-img img,.pdp-thumb img,.line img,.mini img{scale:var(--cs,1)}
.line>a{display:block;width:110px;aspect-ratio:3/4;overflow:hidden}
.line>a img{width:100%;height:100%}
.mini .cw{display:block;width:60px;aspect-ratio:3/4;overflow:hidden}
.mini .cw img{width:100%;height:100%}
.pdp-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pdp-thumb{all:unset;box-sizing:border-box;cursor:pointer;width:64px;flex:none;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);opacity:.6;transition:opacity .2s,border-color .2s}
.pdp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pdp-thumb:hover{opacity:1}
.pdp-thumb.active{opacity:1;border-color:var(--gold)}
.pdp-thumb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pdp h1{font-size:clamp(40px,4.6vw,66px);line-height:1.02}
.pdp .price{font-size:24px;margin:14px 0 0}
.pdp .short{margin:22px 0 0;color:var(--taupe);max-width:50ch}
.opt{margin-top:32px}
.opt-label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:12px}
.sizes{display:flex;flex-wrap:wrap;gap:10px;border:0;padding:0;margin:0}
.sizes label{position:relative}
.sizes input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.sizes span{display:grid;place-items:center;min-width:56px;height:48px;padding:0 14px;border:1px solid var(--line);background:var(--field-bg);cursor:pointer;transition:all .2s}
.sizes input:checked + span{background:var(--gold);color:#231b13;border-color:var(--gold)}
.sizes input:focus-visible + span{outline:2px solid var(--gold);outline-offset:3px}
.sizes input:hover + span{border-color:var(--gold-deep)}
.sizes label.unavailable span{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.sizes label.unavailable input{cursor:not-allowed}
.err{color:var(--err);font-size:14.5px;margin:8px 0 0;min-height:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--field-bg)}
.qty button{all:unset;cursor:pointer;width:46px;height:46px;display:grid;place-items:center;font-size:22px}
.qty button:hover{background:var(--sand-2)}
.qty button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.qty output{min-width:38px;text-align:center}
.buy{display:grid;gap:12px;margin-top:30px}
.assure{list-style:none;margin:28px 0 0;padding:20px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:15px;color:var(--taupe)}
.assure li::before{content:"";display:inline-block;width:6px;height:6px;border:1px solid var(--gold-deep);transform:rotate(45deg);margin-right:12px;vertical-align:middle}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-family:var(--serif);font-size:24px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-family:var(--sans);font-size:24px;color:var(--gold-deep);transition:transform .25s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
details.acc .body{padding:0 0 22px;color:var(--taupe);font-size:16px}
details.acc .body p{margin:0 0 12px}
details.acc .body ul{margin:0;padding-left:20px}
.accs{margin-top:34px}
table.sz{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
table.sz th,table.sz td{border:1px solid var(--line);padding:9px 12px;text-align:left}

/* ---------- Cart ---------- */

.f{display:flex;flex-direction:column;gap:7px}
.f.full{grid-column:1 / -1}
.f label{font-size:15px}

.f input,.f select,.f textarea{font:inherit;font-size:16px;color:var(--text-on-sand);background:var(--field-bg);border:1px solid var(--line);padding:14px 16px;border-radius:0;width:100%;-webkit-appearance:none;appearance:none}

.pay input{margin-top:6px;accent-color:var(--gold-deep);width:18px;height:18px;flex:none}
.pay strong{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2}
.pay span{color:var(--taupe);font-size:15px}
.pay:has(input:checked){border-color:var(--gold-deep);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.check{display:flex;gap:14px;align-items:flex-start;font-size:15.5px;margin:0 0 10px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--gold-deep);width:18px;height:18px;flex:none}
.notice{border-left:2px solid var(--gold);background:var(--sand-2);padding:16px 20px;margin:0 0 34px;font-size:15.5px}
.checkout-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:clamp(30px,5vw,70px);align-items:start;padding-bottom:clamp(70px,9vw,120px)}

/* confirmation / prose */
.done h1{font-size:clamp(40px,5.6vw,80px);line-height:1.05}

.box h2{font-size:28px;margin-bottom:14px}

.next{margin:36px 0 0;padding:0;list-style:none;display:grid;gap:14px}

.prose h2{font-size:32px;margin:44px 0 12px}
.prose p,.prose li{color:var(--text-on-sand)}
.prose ul{padding-left:22px}
.prose .upd{color:var(--taupe);font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-bottom:60px}
.ccard{border:1px solid var(--line);padding:26px;background:var(--field-bg)}
.ccard h3{font-size:26px;margin-bottom:8px}

.ccard a{text-decoration:none;border-bottom:1px solid var(--gold-deep);color:var(--text-on-sand)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);padding-bottom:clamp(70px,9vw,120px);align-items:start}

.contact-cta{background:var(--ink);text-align:center;padding:clamp(80px,11vw,160px) 0}

.fbar nav{display:flex;gap:22px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#f6efe2;border:1px solid var(--gold);padding:14px 22px;z-index:80;transition:all .35s;display:flex;gap:18px;align-items:center;max-width:calc(100% - 32px);font-size:15.5px}

  return '<a class="card'+(oos?' oos':'')+'" data-cat="'+(isBag(p)?'bag':isFree(p)?'free':'sized')+'" href="#/piece/'+p.id+'"><div class="ph">'+(oos?'<span class="tag-oos">Sold out</span>':(isFree(p)?'<span class="tag-fs">Free size</span>':''))+'<img src="'+mainImg(p)+'" alt="'+esc(p.name)+(isBag(p)?' bag':' abaya')+'" loading="lazy" style="object-position:'+(p.pos||"50% 50%")+cropStyle(mainImg(p))+'"><span class="quick">VIEW PIECE</span></div>'+
  '<div class="meta"><h3>'+esc(p.name)+'</h3>'+priceHTML(p)+'</div><p>'+esc(p.short)+'</p>'+stockLabel(p)+'</a>';
}

function trust(){
  var IC=["<path d=\"M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a1.6 1.6 0 1 0 0-.01M17 19a1.6 1.6 0 1 0 0-.01\"/>", "<rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"1.5\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>", "<path d=\"M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z\"/>", "<path d=\"M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v5H4zM20 13h-3v5h3zM17 18c0 2-2 2.5-5 2.5\"/>"];
  var li=TEXT.trust.map(function(t,k){
    return '<li><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k%IC.length]+'</svg><div><strong>'+esc(t.title)+'</strong><span>'+esc(t.text)+'</span></div></li>';

pages.abayas=function(){
  var nS=REGULAR_PRODUCTS.length,nF=FREE_SIZE_PRODUCTS.length;
  /* order = newest first across ALL abayas (sized and free size mixed together).
     1) an "added" date on the piece wins if you set one; 2) otherwise the photo number (29.0.avif -> 29) shows the order you added them; 3) otherwise list position */
  function seqNo(p){var im=pImgs(p);for(var k=0;k<im.length;k++){var m=String(im[k]).split("/").pop().match(/^(\d+)[._]\d/);if(m)return Number(m[1])}return 0}
  var list=ABAYAS.map(function(p,i){return {p:p,i:i,n:seqNo(p)}}).sort(function(a,b){
    var da=a.p.added?Date.parse(a.p.added):0,db=b.p.added?Date.parse(b.p.added):0;
    return db!==da?db-da:(b.n!==a.n?b.n-a.n:b.i-a.i);
  }).map(function(x){return x.p});
  var tabs='<div class="filters coll-fade" role="group" aria-label="Filter collections">'+
    '<button type="button" data-f="all" aria-pressed="true">All<small>'+(nS+nF)+'</small></button>'+
    '<button type="button" data-f="sized" aria-pressed="false">S &ndash; XXL<small>'+nS+'</small></button>'+
    '<button type="button" data-f="free" aria-pressed="false">Free size<small>'+nF+'</small></button></div>';
  return {title:"Abayas | ROOHI", html:
  '<section class="coll-hero"><img src="'+IMG.collectionsHero+'" width="1944" height="809" loading="lazy" alt="A woman in a black embroidered ROOHI abaya holding a cream shopping bag beside a courtyard fountain"><div class="coll-hero-copy"><p class="hero-sub">EXPLORE OUR</p><h1>Abayas</h1><p>Timeless abayas for every moment, every mood, every you.</p><span class="div-line"></span></div></section>'+
  '<div class="on-sand"><div class="wrap"><div class="page-head" style="padding-top:clamp(30px,4vw,50px)"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a><span>/</span>Abayas</nav></div>'+
  '<div class="sec-head" style="margin-top:clamp(30px,4vw,50px)"><h2>All abayas</h2></div>'+tabs+'<p class="filter-note" id="fnote" hidden>Free size pieces come in one size, so there is nothing to choose.</p>'+
  '<div class="cards" id="grid" style="padding-bottom:clamp(70px,9vw,130px)">'+list.map(card).join('')+'</div></div></div>',
  init:function(){
    var bar=$(".filters"); if(!bar)return;
    var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
    var io=(!reduce&&"IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}})},{threshold:.1,rootMargin:"0px 0px -6% 0px"}):null;
    function reveal(){
      if(!io)return;
      var g=$("#grid"),cols=getComputedStyle(g).gridTemplateColumns.split(" ").length||2,k=0;
      $$("#grid .card").forEach(function(c){
        io.unobserve(c);c.classList.remove("in");c.classList.add("rv");
        if(c.hidden)return;
        c.style.setProperty("--d",((k%cols)*0.1)+"s");k++;
        void c.offsetWidth;io.observe(c);
      });
    }
    reveal();
    bar.addEventListener("click",function(e){
      var b=e.target.closest("button[data-f]"); if(!b)return;
      var f=b.dataset.f;
      $$("button",bar).forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
      $$("#grid .card").forEach(function(c){c.hidden=!(f==="all"||c.dataset.cat===f)});
      $("#fnote").hidden=f!=="free";
      reveal();
    });
  }};
};

function pdpGallery(p,oos){

  if(imgs.length<2)return '<div class="pdp-gallery">'+main+'</div>';

    return '<button type="button" class="pdp-thumb'+(i===0?' active':'')+'" data-img="'+i+'" aria-label="Photo '+(i+1)+' of '+imgs.length+'"'+(i===0?' aria-current="true"':'')+'><img src="'+src+'" alt="" loading="lazy" style="'+cropStyle(src).slice(1)+'"></button>';

pages.piece=function(id){
  var r=pages._piece(id),p=byId(id); if(!r||!p||!r.html)return r;
  var bag=isBag(p);
  r.html=r.html.replace('<a href="#/collections">Collections</a>',bag?'<a href="#/bags">Bags</a>':'<a href="#/abayas">Abayas</a>');
  if(bag){
    r.html=r.html.replace(/<a href="#size-guide"[^>]*>Size guide<\/a>/,'').replace(/<details class="acc" id="size-guide">[\s\S]*?<\/details>/,'<details class="acc" id="size-guide" open><summary>Details</summary><div class="body"><p>One size. Message us if you would like exact measurements or more photos of this bag.</p></div></details>').replace(/storing your abaya on a hanger/,'storing your bag in its dust bag');
  }
  return r;
};
pages._piece=function(id){
  var p=byId(id); if(!p) return pages.notfound();
  var oos=!inStock(p);
  var others=PRODUCTS.filter(function(x){return x.id!==p.id&&isBag(x)===isBag(p)}).sort(function(a,b){return (isFree(b)===isFree(p))-(isFree(a)===isFree(p))}).slice(0,3);
  var pSizes=p.sizes||{};
  var sizeList=isBag(p)?["One size"]:isFree(p)?["Free size"]:CONFIG.sizes;
  var sizes=sizeList.map(function(s){
    var on=pSizes[s]!==false;
    return '<label class="'+(on?'':'unavailable')+'" title="'+(on?'':'Unavailable in this piece')+'"><input type="radio" name="size" value="'+s+'"'+((isFree(p)||isBag(p))&&on?' checked':'')+(on?'':' disabled aria-label="'+s+', unavailable"')+'><span>'+s+'</span></label>';
  }).join('');
  var pay=["Card payment","cash on delivery"];
  var buyBlock;
  if(oos){
    var msgLink=hasWA()?waLink("Hello ROOHI, I'd like to know when "+p.name+" will be back in stock."):"#/contact";
    buyBlock='<div class="notice" style="margin-top:32px"><strong>Currently sold out.</strong> This piece is not available right now. Message us to ask when it will be back in stock.</div>'+
    '<div class="buy"><a class="btn block"'+(hasWA()?' target="_blank" rel="noopener"':'')+' href="'+msgLink+'">Message us about this piece</a></div>';
  } else {
    buyBlock='<div class="opt"><div class="opt-label"><span id="szl">'+(isFree(p)||isBag(p)?'Size':'Select your size')+'</span><a href="#size-guide" data-open="size-guide" style="font-size:14px;color:var(--taupe)">Size guide</a></div><fieldset class="sizes" aria-labelledby="szl">'+sizes+'</fieldset><p class="err" id="szerr" role="alert"></p></div>'+
    '<div class="opt"><div class="opt-label"><span>Quantity</span></div><div class="qty"><button type="button" data-q="-1" aria-label="Decrease quantity">&minus;</button><output id="qv" aria-live="polite">1</output><button type="button" data-q="1" aria-label="Increase quantity">+</button></div></div>'+
    '<div class="buy"><button class="btn block" type="button" data-add="'+p.id+'">Add to cart</button><button class="btn block" type="button" data-buy="'+p.id+'">Buy now</button></div>'+
    '<ul class="assure"><li>'+esc(pay.join(" or ").replace(/^./,function(c){return c.toUpperCase()}))+' available</li><li>Free delivery in '+esc(CONFIG.deliveryDays)+'</li></ul>';
  }
  return {title:p.name+" | ROOHI", html:
  '<div class="on-sand"><div class="wrap"><div class="page-head" style="padding-bottom:26px"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a><span>/</span><a href="#/collections">Collections</a><span>/</span>'+esc(p.name)+'</nav></div>'+
  '<div class="pdp">'+pdpGallery(p,oos)+
  '<div><h1>'+esc(p.name)+'</h1>'+priceHTML(p).replace('<span class="price pbox">','<p class="price pbox">').replace(/<\/span>$/,'</p>')+stockLabel(p)+'<p class="short">'+esc(p.short)+'</p>'+
  buyBlock+
  '<div class="accs"><details class="acc" id="size-guide"><summary>Size guide</summary><div class="body"><p>Our abayas are available in S, M, L, XL and XXL, following a relaxed, flowing fit typical of premium abayas. Choose the size closest to your usual clothing size.</p><p>Not sure which to pick? If you are between two sizes, we recommend sizing up for a more relaxed, flowing look. Message us if you would like help choosing.</p>'+(isFree(p)?'<p>This piece is Free size: a single relaxed size, so there is nothing to choose.</p>':'')+'</div></details>'+
  '<details class="acc"><summary>Care</summary><div class="body"><p>Please follow the care label. We recommend dry cleaning for embellished, printed and lace pieces, and storing your abaya on a hanger.</p></div></details>'+
  '<details class="acc"><summary>Delivery &amp; payment</summary><div class="body"><p>Delivery takes '+esc(CONFIG.deliveryDays)+' and is free across the UAE. Pay securely by card online, or pay in cash to the courier when your order arrives.</p></div></details></div></div></div></div></div>'+
  '<section class="section on-sand" style="padding-top:0"><div class="wrap"><div class="sec-head"><h2>How to order</h2><p>Four steps, and you pay by card or cash.</p></div>'+orderSteps()+'</div></section>'+
  '<section class="section on-sand" style="padding-top:0"><div class="wrap"><div class="sec-head"><h2>You may also like</h2><p></p></div><div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+others.map(card).join('')+'</div></div></section>', init:function(){
    var qty=1,root=$(".pdp"),imgs=pImgs(p);
    root.addEventListener("click",pdpClick);
    var cur=0;
    function showImg(i){
      if(imgs.length<2)return;
      i=(i+imgs.length)%imgs.length; cur=i;
      var mi=$("#pdpMain img");mi.src=imgs[i];applyCrop(mi,imgs[i]);
      var ct=$("#pdpCount");if(ct)ct.textContent=(i+1)+" / "+imgs.length;
      $$(".pdp-thumb",root).forEach(function(b,k){var on=k===i;b.classList.toggle("active",on);if(on)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
    }
    var pm=$("#pdpMain");
    if(pm&&imgs.length>1){
      var sx=null,sy=0;
      pm.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
      pm.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))showImg(cur+(dx<0?1:-1))});
      pm.tabIndex=0;
      pm.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")showImg(cur-1);if(e.key==="ArrowRight")showImg(cur+1)});
    }
    function pdpClick(e){
      var t=e.target.closest("[data-q],[data-add],[data-buy],[data-open],[data-img],[data-nav]"); if(!t)return;
      if(t.dataset.nav!=null){showImg(cur+Number(t.dataset.nav))}
      else if(t.dataset.img!=null){showImg(+t.dataset.img)}
      else if(t.dataset.q){qty=Math.max(1,Math.min(10,qty+Number(t.dataset.q)));$("#qv").textContent=qty}
      else if(t.dataset.open){e.preventDefault();var d=$("#size-guide");d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}
      else{
        var sel=$('input[name="size"]:checked');
        if(!sel){$("#szerr").textContent="Please select a size before adding to cart.";$(".sizes").scrollIntoView({block:"center"});return}
        $("#szerr").textContent="";
        addToCart(p.id,sel.value,qty);
        if(t.dataset.buy){location.hash="#/checkout"}
        else toast(esc(p.name)+' ('+esc(sizeText(sel.value).toLowerCase())+') added to your cart. <a href="#/cart">View cart</a>');
      }
    }
    root.addEventListener("change",function(e){if(e.target.name==="size")$("#szerr").textContent=""});
  }};
};

function setErr(id,msg){var e=$("#e-"+id),f=document.getElementById(id);if(e)e.textContent=msg;if(f)f.setAttribute("aria-invalid",msg?"true":"false")}
function validate(v){
  var er={};
  if(v.fullName.trim().split(/\s+/).filter(Boolean).length<2||v.fullName.trim().length<5) er.fullName="Enter your full name (first and last name).";
  var ph=v.phone.replace(/[\s\-()+]/g,""); if(!/^\d{9,15}$/.test(ph)) er.phone="Enter a valid mobile number with 9 to 15 digits.";
  if(v.whatsapp&&!/^\d{9,15}$/.test(v.whatsapp.replace(/[\s\-()+]/g,""))) er.whatsapp="Enter a valid WhatsApp number or leave it empty.";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email.trim())) er.email="Enter a valid email address.";
  if(!v.emirate) er.emirate="Select your emirate.";
  if(v.area.trim().length<2) er.area="Enter your city or area.";
  if(v.street.trim().length<4) er.street="Enter your street, building name or villa number.";
  if(v.mapLink&&!/^https?:\/\/\S+$/i.test(v.mapLink.trim())) er.mapLink="Enter a full link starting with https://";
  return er;
}
function orderText(o){
  var L=["*New ROOHI order "+o.id+"*","",
  "Name: "+o.customer.fullName,"Mobile: "+o.customer.phone+(o.customer.whatsapp?" | WhatsApp: "+o.customer.whatsapp:""),"Email: "+o.customer.email,"",
  "Address: "+[o.address.street,o.address.unit,o.address.area,o.address.emirate].filter(Boolean).join(", "),
  o.address.landmark?"Landmark: "+o.address.landmark:"",o.address.mapLink?"Map: "+o.address.mapLink:"",o.address.notes?"Delivery notes: "+o.address.notes:"","",
  "Items:"].concat(o.items.map(function(i){return "- "+i.name+" | size "+i.size+" | qty "+i.qty+" | "+money(i.price*i.qty)}));
  L.push("","Subtotal: "+money(o.totals.sub),"Delivery: "+(o.totals.ship?money(o.totals.ship):"Free"),"Total: "+money(o.totals.total),"Payment: "+o.payment);
  if(o.note)L.push("Note: "+o.note);
  return L.filter(function(x,i,a){return x!==""||a[i-1]!==""}).join("\n");
}
function orderSheetPayload(order){
  return {type:"order",orderId:order.id,date:order.date,name:order.customer.fullName,phone:order.customer.phone,whatsapp:order.customer.whatsapp,email:order.customer.email,
    emirate:order.address.emirate,area:order.address.area,street:order.address.street,unit:order.address.unit,landmark:order.address.landmark,mapLink:order.address.mapLink,deliveryNotes:order.address.notes,
    items:order.items.map(function(i){return i.name+" | Size "+i.size+" | Qty "+i.qty+" | "+money(i.price*i.qty)}).join("\n"),
    itemCount:order.items.reduce(function(a,i){return a+i.qty},0),subtotal:order.totals.sub,delivery:order.totals.ship,total:order.totals.total,payment:order.payment,orderNote:order.note};
}
function finalizeOrder(order,sent){
  order.sent=sent;
  var all=store(true,"roohi_orders")||[];all.push(order);store(false,"roohi_orders",all);
  store(false,"roohi_last",order);

function submitOrder(e){
  e.preventDefault();
  var g=function(id){var el=document.getElementById(id);return el?el.value:""};
  var v={fullName:g("fullName"),phone:g("phone"),whatsapp:g("whatsapp"),email:g("email"),emirate:g("emirate"),area:g("area"),street:g("street"),unit:g("unit"),landmark:g("landmark"),mapLink:g("mapLink"),deliveryNotes:g("deliveryNotes"),orderNote:g("orderNote")};
  var er=validate(v),first=null;
  ["fullName","phone","whatsapp","email","emirate","area","street","mapLink"].forEach(function(k){setErr(k,er[k]||"");if(er[k]&&!first)first=k});
  var ag=$("#agree"); $("#e-agree").textContent=ag.checked?"":"Please tick the box to confirm your details and accept the terms."; if(!ag.checked&&!first)first="agree";
  if(first){$("#formerr").textContent="Please fix the highlighted fields and try again.";document.getElementById(first).focus();return}
  $("#formerr").textContent="";
  var t=totals(),d=new Date();
  var id="ROH-"+String(d.getFullYear()).slice(2)+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+Math.floor(1000+Math.random()*9000);
  var pm=$('input[name="payment"]:checked'),payVal=pm?pm.value:"Cash on delivery";
  var order={id:id,date:d.toISOString(),customer:{fullName:v.fullName.trim(),phone:v.phone.trim(),whatsapp:v.whatsapp.trim(),email:v.email.trim()},
    address:{emirate:v.emirate,area:v.area.trim(),street:v.street.trim(),unit:v.unit.trim(),landmark:v.landmark.trim(),mapLink:v.mapLink.trim(),notes:v.deliveryNotes.trim(),country:"United Arab Emirates"},
    items:cart.map(function(l){var p=byId(l.id);return {id:l.id,name:p.name,size:l.size,qty:l.qty,price:p.price}}),totals:t,payment:payVal,note:v.orderNote.trim(),sent:false};
  var btn=$("#place");btn.disabled=true;

  if(payVal==="Online payment"&&zinaOn()){
    btn.textContent="Redirecting to secure payment…";
    var base=location.href.split("#")[0];
    var successUrl=base+"#/payment-return?order="+encodeURIComponent(id);
    var cancelUrl=base+"#/payment-return?order="+encodeURIComponent(id)+"&cancelled=1";
    store(false,"roohi_pending_order",order);
    postSheetJSON({type:"payment_intent",orderId:id,amount:Math.round(t.total*100),successUrl:successUrl,cancelUrl:cancelUrl}).then(function(res){
      if(res&&res.ok&&res.redirect_url){
        store(false,"roohi_pending_pi",res.id||"");
        window.location.href=res.redirect_url;
      } else {
        btn.disabled=false;btn.textContent="Place order · "+money(t.total);
        $("#formerr").textContent=(res&&res.error)||"Could not start online payment. Please try again or choose cash on delivery.";
      }
    }).catch(function(){
      btn.disabled=false;btn.textContent="Place order · "+money(t.total);
      $("#formerr").textContent="Could not reach the payment system. Please check your connection and try again.";
    });
    return;
  }

  btn.textContent="Placing your order…";
  function finish(sent){finalizeOrder(order,sent)}
  if(sheetOn()) sendOrQueue(orderSheetPayload(order)).then(finish);
  else finish(false);
}

pages["payment-return"]=function(arg,qs){
  return {title:"Confirming payment | ROOHI",html:
  '<div class="on-sand"><div class="narrow" style="padding:clamp(60px,8vw,110px) 0;text-align:center"><h1 id="pr-h">Confirming your payment…</h1>'+
  '<p class="lede" id="pr-p">Please wait a moment, this only takes a few seconds.</p>'+
  '<div class="actions" id="pr-actions" style="justify-content:center;margin-top:24px"></div></div></div>',
  init:function(){handlePaymentReturn(qs||"")}};
};
function prSet(h,p,actionsHtml){
  var H=$("#pr-h"),P=$("#pr-p"),A=$("#pr-actions");
  if(H)H.textContent=h; if(P)P.textContent=p; if(A)A.innerHTML=actionsHtml||"";
}
function prHelpLink(orderId){
  return hasWA()?'<a class="btn solid" href="'+waLink("Hello ROOHI, I paid online for order "+orderId+" and need help confirming it.")+'" target="_blank" rel="noopener">Message us on WhatsApp</a> ':'';
}
function handlePaymentReturn(qs){
  var qp=new URLSearchParams(qs),orderId=qp.get("order")||"",cancelled=qp.get("cancelled");
  if(cancelled){
    prSet("Payment cancelled","You have not been charged. Your items are still in your cart, so you can try again or choose cash on delivery instead.",
      '<a class="btn solid" href="#/checkout">Back to checkout</a>');
    return;
  }
  var pending=store(true,"roohi_pending_order");
  if(!pending||pending.id!==orderId){
    prSet("We could not find that order","If you completed a payment, please contact us with your order reference so we can confirm it for you.",
      prHelpLink(orderId)+'<a class="btn" href="#/collections">Continue shopping</a>');
    return;
  }
  var piId=store(true,"roohi_pending_pi"),tries=0,maxTries=12;
  function check(){
    tries++;
    postSheetJSON({type:"payment_status",paymentIntentId:piId}).then(function(res){
      var status=res&&res.ok?res.status:null;
      if(status==="completed"){
        prSet("Finishing your order…","Payment received, thank you. Saving your order now.","");
        sendOrQueue(orderSheetPayload(pending)).then(function(sent){
          store(false,"roohi_pending_order",null);store(false,"roohi_pending_pi",null);
          finalizeOrder(pending,sent);
        });
      } else if(status==="failed"||status==="canceled"){
        prSet("Payment was not completed","You have not been charged. Your items are still in your cart — you can try again or choose cash on delivery.",
          '<a class="btn solid" href="#/checkout">Back to checkout</a>');
      } else if(tries<maxTries){
        setTimeout(check,2500);
      } else {
        prSet("Still confirming your payment","This is taking longer than usual. If money left your account, please contact us with your order reference and we will confirm it right away.",
          prHelpLink(orderId)+'<a class="btn" href="#/collections">Continue shopping</a>');
      }
    }).catch(function(){
      if(tries<maxTries) setTimeout(check,2500);
      else prSet("We could not confirm your payment","Please check your connection, or contact us with your order reference.",
        prHelpLink(orderId)+'<a class="btn" href="#/collections">Continue shopping</a>');
    });
  }
  check();
}

/* ---------- router ---------- */
var current=null;
function route(){
  var h=(location.hash||"#/").replace(/^#\/?/,"");
  var qs="",qi=h.indexOf("?"); if(qi>-1){qs=h.slice(qi+1);h=h.slice(0,qi)}
  var parts=h.split("/"),name=parts[0]||"home",arg=parts[1];
  var fn=pages[name]; if(!fn||name==="notfound"||name==="piece"&&!arg){fn=pages.notfound;name="notfound"}
  var pg=fn(arg,qs); if(!pg)return;
  var m=$("#main");
  m.innerHTML=pg.html; document.title=pg.title;
  $$(".menu a").forEach(function(a){var nm=name==="piece"?(byId(arg)&&isBag(byId(arg))?"bags":"abayas"):(name==="collections"?"abayas":name);var on=a.dataset.nav===nm;on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  window.scrollTo(0,0); $("#toast").classList.remove("show");
  $("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");
  if(pg.init)pg.init();
  m.setAttribute("tabindex","-1");
}
window.addEventListener("hashchange",route);

/* cart interactions (event delegation) */
$("#main").addEventListener("click",function(e){
  var q=e.target.closest("[data-cq]"),r=e.target.closest("[data-rm]");
  if(q){var l=cart[+q.dataset.cq];l.qty=Math.max(1,Math.min(10,l.qty+Number(q.dataset.d)));saveCart();route()}
  if(r){cart.splice(+r.dataset.rm,1);saveCart();route()}
});
$("#burger").addEventListener("click",function(){var m=$("#menu"),o=m.classList.toggle("open");this.setAttribute("aria-expanded",o);this.setAttribute("aria-label",o?"Close menu":"Open menu")});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false")}});

/* validate cart against products (in case products changed) */
cart=cart.filter(function(l){return byId(l.id)&&l.qty>0});
renderFooter(); updateBadge(); route(); flushQueue();
})();
</script>
